<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReLEAF Opening Five · the five-minute judging update</title>
<meta name="description" content="Six slides, three speakers and four minutes thirty for the GEMS Taiwan five-minute team update at the iGEM 2026 Grand Jamboree.">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/pages.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M4 20c0-8 5.5-14.5 16-15.5C19.5 14 14 20 4 20Z' fill='%2323684a'/%3E%3C/svg%3E">
</head>
<body>

<header class="hero wrap">
  <p class="eyebrow" data-en="GEMS Taiwan · iGEM 2026 · Biomanufacturing Village" data-zh="GEMS Taiwan · iGEM 2026 · 生物製造村"></p>
  <h1 data-en="Five minutes." data-zh="五分鐘。"></h1>
  <h1 class="h1-muted" data-en="Then they start asking." data-zh="然後他們開始提問。"></h1>
  <p class="lede" style="max-width:60ch;margin-top:1.25rem"
     data-en="The judges have watched your video and read your wiki. These five minutes are not for the project. They are for the two or three results you would most like to be questioned about, and for the limits you would rather name yourself."
     data-zh="評審已經看過你們的影片、讀過你們的 wiki。這五分鐘不是用來介紹專題的。它是用來講那兩三個你們最希望被追問的結果，以及那些你們寧願自己先說出口的限制。"></p>
  <div class="btn-row" style="margin-top:1.75rem">
    <a class="btn btn-accent" href="deck.html" data-en="Open the deck" data-zh="打開投影片"></a>
    <a class="btn btn-ghost" href="script.html" data-en="Read the script" data-zh="讀逐字稿"></a>
  </div>
</header>

<section class="wrap" id="session">
  <div class="sess">
    <div>
      <p class="pill pill-r" data-en="First shift of the Jamboree" data-zh="全場第一輪"></p>
      <div class="sess-date" style="margin-top:.7rem">
        <strong data-en="Fri 13 Nov" data-zh="11 月 13 日（五）"></strong>
        <span data-en="12:00 – 12:25 Paris · 19:00 Taipei" data-zh="巴黎 12:00 – 12:25 · 台北 19:00"></span>
      </div>
      <p class="cd" id="countdown" aria-live="polite"></p>
    </div>
    <dl class="sess-facts">
      <div><dt data-en="Room" data-zh="會談室"></dt><dd>J03</dd></div>
      <div><dt data-en="This deck" data-zh="這份投影片"></dt><dd data-en="6 slides, 4:20" data-zh="6 張，4:20"></dd></div>
      <div><dt data-en="Then" data-zh="接著"></dt><dd data-en="20 min of questions" data-zh="20 分鐘問答"></dd></div>
      <div><dt data-en="Speakers" data-zh="講者"></dt><dd data-en="Chloe, Abigail, Jacquelyn" data-zh="Chloe、Abigail、Jacquelyn"></dd></div>
      <div><dt data-en="Judges" data-zh="評審"></dt><dd data-en="4, all in the room" data-zh="4 位，全部在現場"></dd></div>
      <div><dt data-en="Nominated" data-zh="提名"></dt><dd data-en="Measurement · Hardware · Integrated HP" data-zh="最佳量測 · 最佳硬體 · 整合人文實踐"></dd></div>
    </dl>
  </div>
</section>

<section class="wrap narrow">
  <div class="sec-head">
    <h2 data-en="What iGEM told the judges this session is for" data-zh="iGEM 對評審說明這場會談的用途"></h2>
    <p data-en="Worth reading twice, because three of these four sentences are instructions not to do the obvious thing."
       data-zh="值得讀兩次，因為這四句話裡有三句是在叫你們「不要做那個最直覺的動作」。"></p>
  </div>
  <div class="brief"><ul id="brief"></ul></div>
  <p class="note note-a" style="margin-top:1.5rem"
     data-en="Read against that brief, the five minutes have one job: put your best evidence in front of four people who already know the story, and make it easy for them to ask you a good question. This deck is built backwards from that."
     data-zh="照這份說明來讀，這五分鐘只有一個任務：把你們最好的證據放到四個已經知道故事的人面前，並且讓他們容易問出一個好問題。這份投影片就是從這個任務反推設計的。"></p>
</section>

<section class="wrap">
  <div class="sec-head">
    <h2 data-en="The running order" data-zh="進行順序"></h2>
    <p data-en="Six slides and four minutes twenty of speech. The two handovers are not in the slide budgets: add about twenty seconds for them, which puts the real total near four minutes forty against a five-minute ceiling."
       data-zh="六張投影片、四分二十秒的講話時間。兩次交棒不含在投影片預算裡：請為它們加上約二十秒，所以實際總長接近四分四十秒，而上限是五分鐘。"></p>
  </div>
  <div class="order" id="order"></div>
</section>

<section class="wrap">
  <div class="sec-head">
    <h2 data-en="Who says what, and why that way round" data-zh="誰講什麼，以及為什麼這樣分"></h2>
    <p data-en="Each speaker introduces the territory they will then own for the twenty minutes of questions, so the panel learns who to ask before it needs to."
       data-zh="每位講者會先介紹自己接下來二十分鐘問答要負責的領域，讓評審在需要之前就知道該問誰。"></p>
  </div>
  <div class="grid g3" id="speakers"></div>
</section>

<section class="wrap narrow">
  <div class="sec-head">
    <h2 data-en="Five rules for these five minutes" data-zh="這五分鐘的五條規則"></h2>
  </div>
  <div class="rules" id="rules"></div>
</section>

<section class="wrap">
  <div class="sec-head">
    <h2 data-en="Six techniques that do the work" data-zh="撐起這份投影片的六個技巧"></h2>
    <p data-en="None of these is decoration. Each one is a decision about where a judge's attention goes, and each is worth keeping if you rebuild the deck somewhere else."
       data-zh="這裡沒有一項是裝飾。每一項都是在決定評審的注意力往哪裡去，而且如果你們在別的工具重做這份投影片，每一項都值得保留。"></p>
  </div>
  <div class="rules" id="techniques"></div>
</section>

<section class="wrap">
  <div class="sec-head">
    <h2 data-en="The six layouts" data-zh="六種版面"></h2>
    <p data-en="So you can rebuild this in Keynote, PowerPoint or Slides without losing the argument each layout was chosen to carry."
       data-zh="這樣你們在 Keynote、PowerPoint 或 Google Slides 重做時，不會丟掉每個版面原本要承載的論證。"></p>
  </div>
  <div id="layouts"></div>
</section>

<section class="wrap">
  <div class="sec-head">
    <h2 data-en="The honest list" data-zh="誠實清單"></h2>
    <p data-en="Numbers and sentences from our own wiki that will not survive a judge who checks. Read this before you rehearse, not after."
       data-zh="來自我們自己 wiki、但撐不過評審查證的數字與句子。請在排練之前讀，不要排練之後才讀。"></p>
  </div>
  <div class="hon" id="honest"></div>
</section>

<section class="wrap">
  <div class="sec-head">
    <h2 data-en="What could be new by 13 November" data-zh="到 11 月 13 日之前可以變成新東西的"></h2>
    <p data-en="The brief invites progress since the Wiki Freeze. There are three weeks. These five are ranked by what they add to the judged story per hour of work."
       data-zh="說明裡歡迎分享 Wiki 凍結之後的進展。還有三週。以下五項是按「每小時工作為評審故事增加多少」排序的。"></p>
  </div>
  <div class="fresh" id="fresh"></div>
</section>

<section class="wrap narrow">
  <div class="sec-head">
    <h2 data-en="How to rehearse it" data-zh="怎麼排練"></h2>
  </div>
  <div class="tl" id="plan"></div>
</section>

<script src="assets/js/site.js"></script>
<script src="data/content.js"></script>
<script src="data/deck.js"></script>
<script>
(function () {
  var S = window.Site;

  function countdown() {
    var el = document.getElementById('countdown');
    if (!el) return;
    /* 13 Nov 2026, 12:00 Paris = 11:00 UTC (CET, UTC+1) */
    var t = Date.UTC(2026, 10, 13, 11, 0, 0) - Date.now();
    if (t <= 0) { el.textContent = ''; return; }
    var d = Math.floor(t / 86400000), h = Math.floor(t / 3600000) % 24;
    el.textContent = S.lang === 'zh'
      ? '距離開場還有 ' + d + ' 天 ' + h + ' 小時'
      : d + ' days ' + h + ' hours until you start speaking';
  }

  function draw() {
    var h, i;

    h = '';
    for (i = 0; i < CONTENT.brief.length; i++) h += '<li>' + S.esc(S.p(CONTENT.brief[i])) + '</li>';
    document.getElementById('brief').innerHTML = h;

    h = '';
    var run = 0;
    for (i = 0; i < DECK.slides.length; i++) {
      var s = DECK.slides[i], sp = DECK.speakers[s.speaker];
      var prev = run; run += s.budget;
      h += '<div class="ord" data-who="' + s.speaker + '">' +
        '<div class="ord-n">' + (i + 1) + '</div>' +
        '<div><h3>' + S.esc(S.t(s, 'title')) + '</h3>' +
        '<p>' + S.esc(S.t(s, 'kicker')) + '</p></div>' +
        '<div class="ord-t"><span class="b">' + S.clock(s.budget) + '</span>' +
        '<span class="w">' + S.esc(S.p(sp.name)) + '</span>' +
        '<span class="src">' + S.clock(prev) + ' → ' + S.clock(run) + '</span></div></div>';
    }
    document.getElementById('order').innerHTML = h;

    h = '';
    for (i = 0; i < CONTENT.speakers.length; i++) {
      var k = CONTENT.speakers[i];
      h += '<div class="spk"><div class="top"><h3>' + S.esc(k.name) + '</h3>' +
        '<span class="pill pill-line">' + (S.lang === 'zh' ? '投影片 ' : 'slides ') + k.slides + '</span>' +
        '<span class="pill pill-a">' + S.clock(k.secs) + '</span></div>' +
        '<p class="r">' + S.esc(S.t(k, 'role')) + '</p>' +
        '<p style="font-size:.9375rem;color:var(--ink-2);margin:0">' + S.esc(S.t(k, 'why')) + '</p>' +
        '<dl><dt data-en="Owns in the Q&amp;A" data-zh="問答負責範圍"></dt><dd>' + S.esc(S.t(k, 'owns')) + '</dd>' +
        '<dt data-en="Handover" data-zh="交棒"></dt><dd>' + S.esc(S.t(k, 'hand')) + '</dd></dl></div>';
    }
    document.getElementById('speakers').innerHTML = h;

    h = '';
    for (i = 0; i < CONTENT.rules.length; i++) {
      var r = CONTENT.rules[i];
      h += '<div class="rule"><h3>' + S.esc(S.t(r, 'head')) + '</h3><p>' + S.esc(S.t(r, 'body')) + '</p></div>';
    }
    document.getElementById('rules').innerHTML = h;

    h = '';
    for (i = 0; i < CONTENT.techniques.length; i++) {
      var tq = CONTENT.techniques[i];
      h += '<div class="rule"><h3>' + S.esc(S.t(tq, 'head')) + '</h3><p>' + S.esc(S.t(tq, 'body')) + '</p></div>';
    }
    document.getElementById('techniques').innerHTML = h;

    h = '';
    for (i = 0; i < CONTENT.layouts.length; i++) {
      var l = CONTENT.layouts[i];
      h += '<div class="ly"><div class="ly-n">' + (S.lang === 'zh' ? '版面 ' : 'Layout ') + l.n +
        '<strong>' + S.esc(S.t(l, 'name')) + '</strong></div><div>' +
        '<h4 data-en="Specification" data-zh="規格"></h4><p>' + S.esc(S.t(l, 'spec')) + '</p>' +
        '<h4 data-en="Why this shape" data-zh="為什麼是這個形狀"></h4><p>' + S.esc(S.t(l, 'why')) + '</p></div></div>';
    }
    document.getElementById('layouts').innerHTML = h;

    var LBL = {
      never: { en: 'Never say', zh: '絕對不要說' },
      care:  { en: 'Say it carefully', zh: '要小心地說' },
      fix:   { en: 'Fix before the session', zh: '會談前要處理' }
    };
    h = '';
    for (i = 0; i < CONTENT.honest.length; i++) {
      var o = CONTENT.honest[i];
      h += '<div class="hc ' + o.kind + '"><div class="top">' +
        '<span class="pill ' + (o.kind === 'never' ? 'pill-r' : o.kind === 'care' ? 'pill-w' : 'pill-b') + '">' +
        S.esc(S.p(LBL[o.kind])) + '</span>' +
        '<h3>' + S.esc(S.t(o, 'head')) + '</h3></div>' +
        '<p>' + S.esc(S.t(o, 'body')) + '</p>' +
        '<div class="foot">' + S.srcLink(o.src) + '</div></div>';
    }
    document.getElementById('honest').innerHTML = h;

    h = '';
    for (i = 0; i < CONTENT.fresh.length; i++) {
      var f = CONTENT.fresh[i];
      h += '<div class="fr"><div class="top"><h3>' + S.esc(S.t(f, 'head')) + '</h3>' +
        '<span class="cost">' + S.esc(S.t(f, 'cost')) + '</span></div>' +
        '<p>' + S.esc(S.t(f, 'body')) + '</p></div>';
    }
    document.getElementById('fresh').innerHTML = h;

    h = '';
    for (i = 0; i < CONTENT.plan.length; i++) {
      var p = CONTENT.plan[i];
      h += '<div class="tli"><h3>' + S.esc(S.t(p, 't')) + '</h3><p>' + S.esc(S.t(p, 'b')) + '</p></div>';
    }
    document.getElementById('plan').innerHTML = h;

    S.applyStatic(document.body);
    countdown();
  }

  S.onLang(draw);
  document.addEventListener('DOMContentLoaded', function () { draw(); setInterval(countdown, 60000); });
})();
</script>
</body>
</html>
